name: Create Release

on:
    push:
        branches:
            - main

permissions:
    contents: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Read version from .version
                shell: bash
                run: |
                    VERSION=$(tr -d '[:space:]' < .version)
                    echo "VERSION=$VERSION" >> "$GITHUB_ENV"

            -   name: Prepare dist
                shell: bash
                run: |
                    mkdir -p dist
                    cp -R css js php config.json index.php LICENSE.md RandIMIIntegration.php README.md dist/

            -   name: Package dist as zip
                shell: bash
                run: |
                    cd dist
                    zip -r ../randimi_integration_v${VERSION}.zip .

            -   name: Extract release notes from CHANGELOG.md
                id: notes
                shell: bash
                run: |
                    NOTES=$(awk -v v="$VERSION" '{ sub(/\r$/, "") } /^## / { if (f) exit; f = ($2 == v); next } f' CHANGELOG.md)
                    if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then NOTES="Release v${VERSION}"; fi
                    {
                        echo "body<<EOF_RELEASE_NOTES"
                        echo "$NOTES"
                        echo "EOF_RELEASE_NOTES"
                    } >> "$GITHUB_OUTPUT"

            -   name: Create Release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: v${{ env.VERSION }}
                    name: REDCap-RandIMI-Integration v${{ env.VERSION }}
                    files: randimi_integration_v${{ env.VERSION }}.zip
                    body: ${{ steps.notes.outputs.body }}
                    generate_release_notes: true
